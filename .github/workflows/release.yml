# Release from main: commitizen computes the next version from the commits since the last tag
# (fix -> patch, feat -> minor, breaking -> major; other types release nothing). Tags carry
# the version without a "v" and are the only version source (.cz.toml: version_provider =
# scm). Nothing is committed back to main: the version is stamped into package.json inside
# the jobs that build the binaries, the extension and the npm tarball.
#
# First release: without any tag commitizen starts from 0.0.0, so the first run with a feat
# commit releases 0.1.0 (a fix alone: 0.0.1). The first real run shows the result; to start
# elsewhere, push the desired previous version as a tag before merging.
#
# Prerequisite, once, on npmjs.com: package @altipard/sevdesk-mcp -> Settings -> Trusted
# Publisher -> GitHub Actions, repository altipard/sevdesk-mcp, workflow release.yml (no
# environment). npm only offers this for an existing package, so the very first version may
# have to be published by hand. Without it the npm job fails with a 403/404.
#
# Order and reruns: everything is built and attested before anything is published; then npm,
# then the GitHub release, which also creates the tag, and next to it the MCP registry entry.
# Release assets: the four binaries, the Claude Desktop extension sevdesk-mcp.mcpb and
# SHA256SUMS over all of them. Every publish step checks what already exists and never
# replaces it, so "Re-run all jobs" after a partial failure completes the release: a commit
# that already carries its release tag is resumed instead of bumped again.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: "@altipard/sevdesk-mcp"
  BUN_VERSION: "1.4.4"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # commitizen 4.8.3 and every dependency pinned by hash (uv pip compile --generate-hashes).
      - run: pip install --quiet --require-hashes --no-deps -r scripts/release-requirements.txt

      - id: next
        run: |
          # Same strict X.Y.Z check as for commitizen's answer below.
          resumed=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$resumed" ]; then
            VERSION=$resumed
            echo "HEAD already carries release tag $VERSION; resuming it"
          else
            status=0
            output=$(cz bump --get-next --yes 2>&1) || status=$?
            case "$status" in
              0)
                VERSION=$(printf '%s\n' "$output" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)
                if [ -z "$VERSION" ]; then
                  printf '%s\n' "$output"
                  echo "::error::commitizen succeeded but printed no version"
                  exit 1
                fi
                ;;
              21)
                # NoneIncrementExit: there are commits, none of them releases (docs, ci, chore, ...).
                VERSION=""
                ;;
              *)
                printf '%s\n' "$output"
                echo "::error::commitizen failed with exit code $status"
                exit 1
                ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next version: ${VERSION:-none (no release-relevant commits)}"

  check:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

  binaries:
    needs: [version, check]
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64, arch: "" }
          # Cross-compiled on the arm64 runner and smoke-tested under Rosetta.
          - { os: macos-15, target: darwin-x64, arch: x86_64 }
          - { os: ubuntu-24.04, target: linux-x64, arch: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, arch: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      SMOKE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: npm ci --ignore-scripts

      - run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - run: bun scripts/build-bin.mjs "$TARGET"

      - name: Rosetta for the x64 smoke test
        if: matrix.arch == 'x86_64'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # Also checks that the binary reports the release version.
      - run: |
          if [ -z "$SMOKE_ARCH" ]; then unset SMOKE_ARCH; fi
          node scripts/smoke-bin.mjs "out/bin/sevdesk-mcp-$TARGET"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sevdesk-mcp-${{ matrix.target }}
          path: out/bin/sevdesk-mcp-${{ matrix.target }}
          if-no-files-found: error

  # Claude Desktop extension: dist/ plus production dependencies, run by the client's built-in
  # Node.js. Dependency install scripts are skipped; the smoke test starts the server from the
  # unpacked bundle with the manifest's command and environment.
  mcpb:
    needs: [version, check]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - run: npm run build:mcpb

      # Also checks that the bundled server reports the release version.
      - run: node scripts/smoke-mcpb.mjs out/mcpb/sevdesk-mcp.mcpb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sevdesk-mcp-mcpb
          path: out/mcpb/sevdesk-mcp.mcpb
          if-no-files-found: error

  # Signed build provenance for the binaries and the extension; verify a download with
  #   gh attestation verify <file> --repo altipard/sevdesk-mcp
  attest:
    needs: [version, binaries, mcpb]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: sevdesk-mcp-*
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/sevdesk-mcp-*
            assets/sevdesk-mcp.mcpb

  # Builds the npm tarball without any publish rights. Dependency install scripts are skipped;
  # the package's own prepack (codegen and tsc) runs.
  pack:
    needs: [version, check]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - id: pack
        run: |
          mkdir -p out/pack
          npm pack --pack-destination out/pack
          set -- ./out/pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball, found: $*"
            exit 1
          fi
          sha256=$(sha256sum "$1" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  $1"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: out/pack/*.tgz
          if-no-files-found: error

  # Publish only: no checkout, no install, no build in the job that holds the OIDC token.
  # Trusted publishing exchanges that token for a short-lived npm token (see prerequisite at
  # the top); provenance links the package to this run.
  npm:
    needs: [version, pack, attest]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARBALL_SHA256: ${{ needs.pack.outputs.sha256 }}
    steps:
      # No checkout here, so .nvmrc is not available: same as .nvmrc, kept in sync by
      # test/unit/workflows.test.ts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs 11.5.1)"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: pack

      # The tarball must be the one the pack job built, for this package and this version.
      # The path keeps its ./ prefix: npm reads "pack/x.tgz" as a GitHub user/repo shorthand.
      - name: check the tarball
        id: tarball
        run: |
          set -- ./pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball, found: $*"
            exit 1
          fi
          actual=$(sha256sum "$1" | cut -d ' ' -f 1)
          if [ -z "$TARBALL_SHA256" ] || [ "$actual" != "$TARBALL_SHA256" ]; then
            echo "::error::tarball checksum $actual does not match the pack job ($TARBALL_SHA256)"
            exit 1
          fi
          # shellcheck disable=SC2016 # the single quotes hold JavaScript, not shell
          tar -xzOf "$1" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const { PACKAGE, VERSION } = process.env;
            if (pkg.name !== PACKAGE || pkg.version !== VERSION) {
              console.error(`::error::tarball holds ${pkg.name}@${pkg.version}, expected ${PACKAGE}@${VERSION}`);
              process.exit(1);
            }'
          echo "file=$1" >> "$GITHUB_OUTPUT"

      - name: publish
        env:
          TARBALL: ${{ steps.tarball.outputs.file }}
        run: |
          # Anonymous lookup: the .npmrc from setup-node carries a placeholder token.
          if NPM_CONFIG_USERCONFIG=/dev/null npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          npm publish "$TARBALL" --provenance --access public --ignore-scripts

  # Lists the npm package in the official MCP registry (registry.modelcontextprotocol.io).
  # server.json and mcpName in package.json name io.github.altipard/sevdesk-mcp; GitHub OIDC
  # proves the io.github.altipard namespace, no secret involved. server.json keeps the 0.0.0
  # placeholder in git like mcpb/manifest.json: the release version is stamped in here. The
  # registry checks mcpName in the published package, so this waits until npm serves it.
  # A version once in the registry cannot change; a rerun skips it.
  mcp-registry:
    needs: [version, npm]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Bump both together; the checksum is from the release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: stamp the release version into server.json
        id: server
        run: |
          name=$(jq -r .name server.json)
          if [ "$(jq -r .mcpName package.json)" != "$name" ]; then
            echo "::error::mcpName in package.json does not match $name in server.json"
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.new
          mv server.json.new server.json
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: wait for the package on npm
        env:
          NAME: ${{ steps.server.outputs.name }}
        run: |
          for _ in $(seq 1 30); do
            published=$(NPM_CONFIG_USERCONFIG=/dev/null npm view "$PACKAGE@$VERSION" mcpName 2>/dev/null || true)
            if [ "$published" = "$NAME" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::npm does not serve $PACKAGE@$VERSION with mcpName $NAME"
          exit 1

      - name: download mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsS --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --retry 2 -L \
            -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher

      - name: publish
        env:
          NAME: ${{ steps.server.outputs.name }}
        run: |
          encoded=$(printf '%s' "$NAME" | jq -sRr @uri)
          status=$(curl -sS --proto '=https' --tlsv1.2 --connect-timeout 15 --retry 2 \
            -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$encoded/versions/$VERSION")
          case "$status" in
            200)
              echo "$NAME $VERSION is already in the MCP registry; nothing to publish"
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::MCP registry lookup answered HTTP $status"
              exit 1
              ;;
          esac
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  github-release:
    needs: [version, attest, npm]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: sevdesk-mcp-*
          merge-multiple: true

      # gh creates the tag on the released commit through the API; no push from the runner.
      # A published asset is never replaced: a rerun only adds what a partial run left out.
      - name: tag and release
        run: |
          files=(sevdesk-mcp-darwin-arm64 sevdesk-mcp-darwin-x64 sevdesk-mcp-linux-x64 sevdesk-mcp-linux-arm64 sevdesk-mcp.mcpb)
          if ! existing=$(gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null); then
            (cd assets && sha256sum "${files[@]}" > SHA256SUMS && cat SHA256SUMS)
            gh release create "$VERSION" assets/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              --notes "Verify a binary: gh attestation verify <file> --repo $GH_REPO"
            exit 0
          fi
          has() { printf '%s\n' "$existing" | grep -qxF "$1"; }
          missing=()
          for name in "${files[@]}" SHA256SUMS; do
            has "$name" || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "release $VERSION is complete; nothing to upload"
            exit 0
          fi
          if has SHA256SUMS; then
            # The published sums describe files of the earlier run; a rebuilt one would not match.
            echo "::error::release $VERSION has SHA256SUMS but lacks: ${missing[*]}. Delete the release and its tag, then re-run."
            exit 1
          fi
          # Sums over exactly what the release will hold: published files as they are, rebuilt
          # ones only where missing. --clobber replaces the local rebuilt copy, not the asset.
          for name in "${files[@]}"; do
            if has "$name"; then
              gh release download "$VERSION" --pattern "$name" --dir assets --clobber
            fi
          done
          (cd assets && sha256sum "${files[@]}" > SHA256SUMS && cat SHA256SUMS)
          for name in "${missing[@]}"; do
            gh release upload "$VERSION" "assets/$name"
          done
